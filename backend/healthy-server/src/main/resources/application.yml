spring:
  application:
    name: appointment-api
  profiles:
    default: local
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 2s
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.healthy.appointment.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# 只输出 Mapper 执行的 SQL，便于本地开发排查；不会记录数据库密码。
logging:
  level:
    com.healthy.appointment.mapper: debug

jwt:
  secret: ${JWT_SECRET:healthy-appointment-local-development-secret-key-2026}
  ttl: PT24H

appointment:
  stock:
    repair-delay: 3s
    repair-check-ttl: 8s
  waitlist:
    offer-duration: 10s
    offer-expire-check-delay: 2m
    recovery-batch-size: 100
