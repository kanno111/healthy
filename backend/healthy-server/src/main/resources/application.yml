spring:
  application:
    name: healthy-server
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: "8"
    baseline-description: Existing schema before Flyway adoption
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    fail-on-missing-locations: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 500ms
          multiplier: 2
          max-interval: 2s
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.healthy.appointment.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# 只输出 Mapper 执行的 SQL，便于本地开发排查；不会记录数据库密码。
logging:
  file:
    name: logs/hospital-appointment.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
  level:
    root: info
    com.healthy.appointment: info
    com.healthy.appointment.mapper: info
    org.mybatis: info
    com.baomidou.mybatisplus: info
    org.springframework: info

jwt:
  secret: ${JWT_SECRET:healthy-appointment-local-development-secret-key-2026}
  ttl: PT24H

appointment:
  stock:
    repair-delay: 3s
    repair-check-ttl: 8s
  outbox:
    relay-enabled: true
    relay-delay: 1s
    batch-size: 50
    max-attempts: 5
    retry-initial-delay: 5s
    retry-multiplier: 3
    retry-max-delay: 5m
    processing-timeout: 1m
  waitlist:
    offer-duration: 10s
    offer-expire-check-delay: 2m
    recovery-batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,sentinel
