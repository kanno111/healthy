server:
  port: ${IDENTITY_SERVER_PORT:8083}
  servlet:
    context-path: /api

spring:
  application:
    name: healthy-identity
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${IDENTITY_DB_HOST:${DB_HOST:localhost}}:${IDENTITY_DB_PORT:${DB_PORT:3306}}/${IDENTITY_DB_NAME:healthy_identity}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${IDENTITY_DB_USERNAME:${DB_USERNAME:root}}
    password: ${IDENTITY_DB_PASSWORD:${DB_PASSWORD:}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:3}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    fail-on-missing-locations: true
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:healthy-appointment-local-development-secret-key-2026}
  ttl: PT24H

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.healthy.identity: info
