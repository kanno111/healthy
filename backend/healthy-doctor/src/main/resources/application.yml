server:
  port: ${DOCTOR_SERVER_PORT:8082}
  servlet:
    context-path: /api

spring:
  application:
    name: healthy-doctor
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DOCTOR_DB_HOST:${DB_HOST:localhost}}:${DOCTOR_DB_PORT:${DB_PORT:3306}}/${DOCTOR_DB_NAME:healthy_doctor}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DOCTOR_DB_USERNAME:${DB_USERNAME:root}}
    password: ${DOCTOR_DB_PASSWORD:${DB_PASSWORD:}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    fail-on-missing-locations: true
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.healthy.doctor: info
