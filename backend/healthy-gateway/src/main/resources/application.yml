server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: healthy-gateway
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          routes:
            - id: healthy-doctor-internal
              uri: lb://healthy-doctor
              order: -100
              predicates:
                - Path=/doctor-service/actuator/health
              filters:
                - StripPrefix=1
                - PrefixPath=/api
            - id: healthy-doctor-admin
              uri: lb://healthy-doctor
              order: -100
              predicates:
                - Path=/api/admin/doctors,/api/admin/doctors/**,/api/admin/departments,/api/admin/departments/**
            - id: healthy-doctor-user-departments
              uri: lb://healthy-doctor
              order: -100
              predicates:
                - Path=/api/user/departments
            - id: healthy-server
              uri: lb://healthy-server
              order: 0
              predicates:
                - Path=/api/**
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      datasource:
        gateway-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:}
            password: ${NACOS_PASSWORD:}
            data-id: ${SENTINEL_GATEWAY_RULE_DATA_ID:healthy-gateway-flow-rules}
            group-id: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
            data-type: json
            rule-type: gw-flow

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:3}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

jwt:
  secret: ${JWT_SECRET:healthy-appointment-local-development-secret-key-2026}

gateway:
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,sentinel

logging:
  level:
    root: info
    com.healthy.gateway: info
